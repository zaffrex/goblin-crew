# 정기 실행: 역할별 작업 루프(매시간, 역할마다 시차) + 정기 회의.
# 빈도 조정은 team/schedule.json, 완전 정지는 저장소 변수 TEAM_PAUSED=true.
name: team-schedule

on:
  schedule:
    - cron: "5 * * * *"    # pm tick
    - cron: "17 * * * *"   # designer tick
    - cron: "29 * * * *"   # frontend tick
    - cron: "41 * * * *"   # backend tick
    - cron: "53 * * * *"   # infra tick
    - cron: "0 0 * * *"    # 09:00 KST 데일리 스탠드업
    - cron: "0 1 * * 1"    # 월 10:00 KST 스프린트 플래닝
    - cron: "0 5 * * 1,4"  # 월·목 14:00 KST 설계 회의
    - cron: "0 8 * * 5"    # 금 17:00 KST 회고 + 주간 리포트
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: vars.TEAM_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: team
      - name: Decide and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          cfg=team/schedule.json
          if [ "$(jq -r .paused $cfg)" = "true" ]; then echo "paused by team/schedule.json"; exit 0; fi
          hour_kst=$(TZ=Asia/Seoul date +%-H)
          if jq -e --argjson h "$hour_kst" '.quiet_hours_kst | index($h)' $cfg >/dev/null; then echo "quiet hour"; exit 0; fi

          run() { echo "dispatch: $*"; gh workflow run agent.yml -f role="$1" -f mode="$2" -f context="$3"; }
          tick() {
            jq -e --arg r "$1" '.tick_roles | index($r)' $cfg >/dev/null || { echo "$1 not in tick_roles"; return; }
            every=$(jq -r .tick_every_hours $cfg)
            if [ $(( $(date -u +%-H) % every )) -ne 0 ]; then echo "skip tick (every ${every}h)"; return; fi
            # cron이 늦게 오면 slack-listener 감시가 먼저 깨웠을 수 있다. 45분 안에 같은 역할 tick이 있으면 건너뛴다.
            since=$(date -u -d '-45 min' +%Y-%m-%dT%H:%M:%SZ)
            if gh run list --workflow agent.yml --limit 50 --json displayTitle,createdAt \
                | jq -e --arg p "$1 · tick" --arg s "$since" 'any(.[]; (.displayTitle | startswith($p)) and .createdAt > $s)' >/dev/null; then
              echo "skip tick ($1 ticked within 45 min)"; return
            fi
            run "$1" tick "정기 작업 (매 ${every}시간)"
          }
          meeting() {
            [ "$(jq -r .meetings_enabled $cfg)" = "true" ] || { echo "meetings disabled"; return; }
            run pm meeting "$1"
          }

          case "${SCHEDULE:-manual}" in
            "5 * * * *")   tick pm ;;
            "17 * * * *")  tick designer ;;
            "29 * * * *")  tick frontend ;;
            "41 * * * *")  tick backend ;;
            "53 * * * *")  tick infra ;;
            "0 0 * * *")   meeting "standup: 데일리 스탠드업" ;;
            "0 1 * * 1")   meeting "planning: 주간 스프린트 플래닝" ;;
            "0 5 * * 1,4") meeting "design: 정기 설계 회의 (L2 안건 토론, ADR 담당자 지정)" ;;
            "0 8 * * 5")   meeting "retro: 주간 회고, 끝나면 사장님께 주간 리포트" ;;
            manual)        for r in pm designer frontend backend infra; do run "$r" tick "수동 전체 실행"; done ;;
          esac
