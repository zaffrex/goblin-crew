# 기본 CI. 기술 스택이 정해지면 인프라(Sam)가 확장한다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Team config is valid JSON
        run: jq empty team/team.json team/schedule.json team/slack-apps/*.json
      - name: Shell scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S error scripts/*.sh
      - uses: actions/setup-node@v7
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
      - name: Node checks
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile && R="pnpm run"
          else npm ci && R="npm run"; fi
          $R lint --if-present
          $R typecheck --if-present
          $R test --if-present
          $R build --if-present
