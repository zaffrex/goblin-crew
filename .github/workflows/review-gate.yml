# 리뷰 게이트: 모든 역할이 같은 봇 계정을 쓰므로 GitHub 기본 승인 대신 서명 기반 승인을 검사한다.
# - 일반 PR: 작성자와 다른 역할의 "✅ 승인" 1개 이상, 미해결 "🔁 수정 요청" 없음
# - ADR PR (docs/adr/ 변경): 서로 다른 역할 승인 2개 이상 + PM 승인 (PM이 작성자면 다른 역할 2개)
# - 회의록/상태 문서만 바뀐 PR, 사장님이 연 PR: 자동 통과
# 승인은 마지막 커밋 이후에 달린 것만 유효하다.
name: review-gate

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  statuses: write
  pull-requests: read
  issues: read
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  gate:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            team
            scripts
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: scripts/review-gate.sh
