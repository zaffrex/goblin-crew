# 한 역할(에이전트)을 깨워서 한 번의 작업 루프를 돌린다.
# 직접 트리거: 스케줄(team-schedule.yml), 이벤트 라우터(router.yml), 수동 실행.
name: agent

on:
  workflow_dispatch:
    inputs:
      role:
        description: "pm | designer | frontend | backend | infra"
        required: true
        type: choice
        options: [pm, designer, frontend, backend, infra]
      mode:
        description: "tick(정기 작업) | event(이벤트 대응) | meeting(회의 진행, pm 전용)"
        required: true
        default: tick
        type: choice
        options: [tick, event, meeting]
      context:
        description: "깨운 이유 (이벤트 요약, 회의 종류 등)"
        required: false
        default: ""

concurrency:
  # 같은 역할은 동시에 하나만. 대기 중인 실행은 최신 하나로 대체된다 (역할은 어차피 전체 상태를 다시 훑는다).
  group: agent-${{ inputs.role }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write   # Claude GitHub App 토큰 교환(OIDC)

jobs:
  run:
    if: vars.TEAM_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Slack bot is in team channels
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: scripts/slack.sh join-all

      - name: Build prompt
        id: prompt
        env:
          ROLE: ${{ inputs.role }}
          MODE: ${{ inputs.mode }}
          CONTEXT: ${{ inputs.context }}
        run: |
          {
            echo 'text<<__PROMPT_EOF__'
            scripts/build-prompt.sh "$ROLE" "$MODE" "$CONTEXT"
            echo '__PROMPT_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Run agent
        uses: anthropics/claude-code-action@v1
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AGENT_ROLE: ${{ inputs.role }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 라우터가 GITHUB_TOKEN으로 workflow_dispatch를 하므로 실행 주체가 github-actions[bot]이 된다.
          allowed_bots: "github-actions[bot]"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ vars.AGENT_MODEL || 'opus' }}
            --max-turns ${{ inputs.mode == 'meeting' && 200 || 120 }}
            --permission-mode auto
            --append-system-prompt-file .claude/agents/${{ inputs.role }}.md

      - name: Report failure to Slack
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/slack.sh --as infra post dev "⚠️ \`${{ inputs.role }}\` 에이전트 실행 실패 (${{ inputs.mode }}). 로그: $RUN_URL" || true
