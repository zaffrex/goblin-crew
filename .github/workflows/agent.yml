# 한 역할(에이전트)을 깨워서 한 번의 작업 루프를 돌린다.
# 직접 트리거: 스케줄(team-schedule.yml), 이벤트 라우터(router.yml), 수동 실행.
name: agent
# 실행 목록에서 누가 어떤 모드로 돌았는지 보이게 한다. slack-listener.sh 감시와 team-schedule.yml 중복 방지가 이 이름("<role> · <mode>")으로 실행을 찾는다.
run-name: "${{ inputs.role }} · ${{ inputs.mode }}"

on:
  workflow_dispatch:
    inputs:
      role:
        description: "pm | designer | frontend | backend | infra | qa (qa는 격리 실행, #516)"
        required: true
        type: choice
        options: [pm, designer, frontend, backend, infra, qa]
      mode:
        description: "tick(정기 작업) | event(이벤트 대응) | meeting(회의 진행, pm 전용)"
        required: true
        default: tick
        type: choice
        options: [tick, event, meeting]
      context:
        description: "깨운 이유 (이벤트 요약, 회의 종류 등)"
        required: false
        default: ""

concurrency:
  # 같은 역할은 동시에 하나만. 대기 중인 실행은 최신 하나로 대체된다 (역할은 어차피 전체 상태를 다시 훑는다).
  group: agent-${{ inputs.role }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write   # Claude GitHub App 토큰 교환(OIDC)

jobs:
  run:
    if: vars.TEAM_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # QA 실행에는 QA 토큰만 넣는다(#516). 다른 역할 토큰이 env에 있으면 `--as pm`으로 정답 채널을 읽을 수 있다.
    env:
      SLACK_TOKEN_PM: ${{ inputs.role != 'qa' && secrets.SLACK_TOKEN_PM || '' }}
      SLACK_TOKEN_DESIGNER: ${{ inputs.role != 'qa' && secrets.SLACK_TOKEN_DESIGNER || '' }}
      SLACK_TOKEN_FRONTEND: ${{ inputs.role != 'qa' && secrets.SLACK_TOKEN_FRONTEND || '' }}
      SLACK_TOKEN_BACKEND: ${{ inputs.role != 'qa' && secrets.SLACK_TOKEN_BACKEND || '' }}
      SLACK_TOKEN_INFRA: ${{ inputs.role != 'qa' && secrets.SLACK_TOKEN_INFRA || '' }}
      SLACK_TOKEN_QA: ${{ secrets.SLACK_TOKEN_QA }}
      SLACK_BOT_TOKEN: ${{ inputs.role != 'qa' && secrets.SLACK_BOT_TOKEN || '' }}   # 구버전 단일 앱 (없어도 됨)
      AGENT_ROLE: ${{ inputs.role }}
    steps:
      - uses: actions/checkout@v7
        if: inputs.role != 'qa'
        with:
          fetch-depth: 0
          persist-credentials: false

      # QA(Mia)는 정답을 모르는 채 플레이해야 한다(#516). 설계 문서, 화면 데이터, 플레이 해법, git 기록이 디스크에 없게
      # 필요한 파일만, 기록 없이(depth 1) 받는다. 도구도 아래에서 좁힌다.
      - uses: actions/checkout@v7
        if: inputs.role == 'qa'
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /CLAUDE.md
            /.claude/agents/qa.md
            /team/team.json
            /scripts/slack.sh
            /scripts/build-prompt.sh
            /scripts/qa/
            /scripts/playtest/cdp.ts

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Ensure member bots are in team channels
        run: scripts/slack.sh join-all

      - name: Resolve model for role
        id: model
        env:
          ROLE: ${{ inputs.role }}
          OVERRIDE: ${{ vars.AGENT_MODEL }}
        run: |
          model=$(jq -r --arg r "$ROLE" '.roles[$r].model' team/team.json)
          effort=$(jq -r --arg r "$ROLE" '.roles[$r].effort' team/team.json)
          fallback=$(jq -r '.fallback_model' team/team.json)
          [ -n "$OVERRIDE" ] && model="$OVERRIDE"   # 비상 조절용 전역 덮어쓰기
          args="--model $model --effort $effort"
          [ "$fallback" != "$model" ] && args="$args --fallback-model $fallback"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "role=$ROLE $args"

      # 게임은 시스템 글꼴을 쓴다(ADR-0007 9절). 러너에는 일본어 글꼴이 없어 QA 스크린샷의 글자가 전부 □로 나왔다(#603).
      - name: Install Japanese fonts for QA
        if: inputs.role == 'qa'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null && fc-list :lang=ja | wc -l

      - name: Build prompt
        id: prompt
        env:
          ROLE: ${{ inputs.role }}
          MODE: ${{ inputs.mode }}
          CONTEXT: ${{ inputs.context }}
        run: |
          {
            echo 'text<<__PROMPT_EOF__'
            scripts/build-prompt.sh "$ROLE" "$MODE" "$CONTEXT"
            echo '__PROMPT_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Run agent
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 라우터가 GITHUB_TOKEN으로 workflow_dispatch를 하므로 실행 주체가 github-actions[bot]이 된다.
          allowed_bots: "github-actions[bot]"
          additional_permissions: |
            workflows: write
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            ${{ steps.model.outputs.args }}
            --max-turns ${{ inputs.role == 'qa' && 100 || inputs.mode == 'meeting' && 200 || 120 }}
            ${{ inputs.role == 'qa' && '--permission-mode dontAsk --tools "Read,Write,Bash" --allowedTools "Read,Write(qa-work/**),Edit(./qa-work/**),Bash(scripts/slack.sh:*),Bash(node scripts/qa/browse.ts:*),Bash(gh issue comment:*),Bash(gh issue create:*)"' || '--permission-mode auto' }}
            --append-system-prompt-file .claude/agents/${{ inputs.role }}.md
          bot_id: "209825114"
          # QA 실행이 2턴 만에 끝난 원인(거부된 명령)이 로그에 안 남는다(#601, #603). QA 실행에서만 전체 출력을 켠다.
          # 비밀값은 GitHub이 로그에서 가린다. QA 실행에는 QA·infra 토큰 외에 아무것도 없다.
          show_full_output: ${{ inputs.role == 'qa' }}

      # Mia 스크린샷을 팀이 볼 수 있게 한다(#684). PNG만 올린다(report.md 등 제외). 보관 7일, 공개 저장소라 로그인한 사람은 받을 수 있다.
      - name: Upload QA screenshots
        id: qa_shots
        if: always() && inputs.role == 'qa'
        uses: actions/upload-artifact@v4
        with:
          name: qa-shots
          path: qa-work/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Announce QA screenshots
        if: always() && inputs.role == 'qa' && steps.qa_shots.outputs.artifact-url != ''
        env:
          SLACK_TOKEN_INFRA: ${{ secrets.SLACK_TOKEN_INFRA }}
          AGENT_ROLE: ""
          RUN_ID: ${{ github.run_id }}
        run: |
          scripts/slack.sh --as infra post dev "QA 스크린샷(7일 보관): \`gh run download $RUN_ID -n qa-shots\` 후 Read로 열어요." || true

      - name: Report failure to Slack
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 실패 보고는 에이전트 밖에서 infra 신원으로 쓴다. QA 실행에서도 이 step에만 infra 토큰을 넣는다.
          SLACK_TOKEN_INFRA: ${{ secrets.SLACK_TOKEN_INFRA }}
          AGENT_ROLE: ""
        run: |
          scripts/slack.sh --as infra post dev "⚠️ \`${{ inputs.role }}\` 에이전트 실행 실패 (${{ inputs.mode }}). 로그: $RUN_URL" || true
