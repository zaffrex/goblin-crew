version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # 마이너·패치는 PR 하나로 묶는다 (리뷰 1번, 머지 1번)
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # 런타임이 Node 22(package.json engines, CI)라 타입도 22에 맞춘다. 올릴 때는 engines와 함께 올린다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 메이저(7.x)는 빌드 스택 변경이라 FE가 별도 이슈로 검토한다 (ADR-0004).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    # 워크플로 파일은 CODEOWNERS로 진마씨 승인이 필요하다. 한 달에 PR 하나로 묶어 승인 횟수를 줄인다.
    schedule:
      interval: monthly
    groups:
      actions-all:
        patterns: ["*"]
