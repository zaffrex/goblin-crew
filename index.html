<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- ADR-0005: L3 정식 런칭 전까지 검색 노출 금지 (가제 상표 조사 전). 런칭 L3 결정 때 제거한다.
         프로젝트 사이트(/goblin-crew/)는 오리진 루트가 아니라 robots.txt가 효과 없어서 meta로 막는다. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>goblin-crew (prototype)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      body { display: grid; place-items: center; }
      #game { display: block; image-rendering: pixelated; touch-action: none; }
      #hud {
        position: fixed; left: 8px; top: 8px; margin: 0;
        font: 14px/1.4 system-ui, sans-serif; color: #eee;
        background: rgb(0 0 0 / 0.5); padding: 4px 8px; border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <p id="hud" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
