<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- ADR-0005: L3 정식 런칭 전까지 검색 노출 금지 (가제 상표 조사 전). 런칭 L3 결정 때 제거한다.
         프로젝트 사이트(/goblin-crew/)는 오리진 루트가 아니라 robots.txt가 효과 없어서 meta로 막는다. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>goblin-crew (prototype)</title>
    <!-- #109: 아이콘 링크가 없으면 브라우저가 도메인 루트 /favicon.ico를 요청해 404 콘솔 에러가 난다(M1 판정 A4).
         빈 data URI는 요청 자체를 만들지 않는다. 실제 아이콘은 아트 작업 때 base 기준 경로로 바꾼다. -->
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      body { display: grid; place-items: center; }
      #game { display: block; image-rendering: pixelated; touch-action: none; }
      /* 목표 줄(#336, 설계 6-2-2절): 창이 아니라 게임 화면 내부 (4,4)에 붙인다. 모양은 HUD 이름표(.hudtag)와 같다.
         글자 크기는 main.ts(내부 7px × 배율, 최소 11). 한 줄이 둥지 앞 x 118을 넘으면(1.0·1.333배) main.ts가 글 파일의
         줄바꿈 자리(U+200B)를 줄바꿈으로 바꿔 두 줄로 쓴다(낱말 중간 줄바꿈 방지). 폭은 글에 딱 맞게(max-content). */
      #hud {
        position: fixed; margin: 0; pointer-events: none; width: max-content; white-space: pre-line;
        font: 11px/1.25 system-ui, sans-serif; color: #fffdf5;
        background: rgb(0 0 0 / 0.6); padding: 0.1em 0.35em; border-radius: 3px;
      }
      /* 말풍선·라벨은 DOM 글자(ADR-0004 결정 3). 위치는 main.ts가 화면 px로 정한다. 입력은 캔버스가 받는다. */
      #bubble, #label, #clear, #faint { position: fixed; margin: 0; pointer-events: none; white-space: pre-line; text-align: center; }
      /* 말풍선(#329): 폭은 글로만 정한다(max-content). 예전 `left = 화자 x` + translate(-50%)는 자동 폭이 `뷰포트 − left`에
         묶여서 오른쪽 화자일수록 좁게 접혔다. 최대 폭·left·top·꼬리 x(--tail-x)는 main.ts가 core/bubble.ts로 정한다. */
      #bubble {
        width: max-content; box-sizing: border-box;
        font: 600 16px/1.35 system-ui, sans-serif; color: #1d1d1d;
        background: #fffdf5; border: 2px solid #1d1d1d; border-radius: 0.625em; padding: 0.375em 0.625em;
      }
      /* 글자 크기는 main.ts가 배율에 맞춰 정한다(내부 9px × 배율, 최소 16). 여백·모서리는 em이라 같이 커지고 테두리는 2px 고정.
         꼬리: 45° 돌린 10px 네모의 두 변. 밀려도 화자를 가리킨다. 글자가 커져도 10px 고정(gap 9 계산 유지, 6-5절). */
      #bubble::after {
        content: ""; position: absolute; left: var(--tail-x, 50%); bottom: -7px;
        width: 10px; height: 10px; margin-left: -7px; box-sizing: border-box; background: #fffdf5;
        border: solid #1d1d1d; border-width: 0 2px 2px 0; transform: rotate(45deg);
      }
      #bubble[data-below]::after { bottom: auto; top: -7px; border-width: 2px 0 0 2px; }
      /* 대상 라벨: 글자 크기는 main.ts가 배율로 정한다(내부 7px × 배율, 최소 14, #337). 여백·모서리는 em이라 같이 커진다.
         폭은 글로만(max-content): `left = 화면 가운데`라 자동 폭이면 `창 − left`에 묶여 1.0배에서 긴 안내가 접힌다(#329와 같은 원인). */
      #label {
        width: max-content; transform: translate(-50%, -100%);
        font: 14px/1.3 system-ui, sans-serif; color: #fffdf5;
        background: rgb(0 0 0 / 0.6); padding: 0.15em 0.6em; border-radius: 0.3em;
      }
      /* HUD 이름표(#255, 설계 6-1-2절): #label과 같은 모양. 글자 크기는 main.ts가 배율로 정한다(최소 11px).
         line-height 1: 휴대폰 가로에서도 아래끝이 HUD 영역 안에 들어가게(PR #259 리뷰). */
      .hudtag {
        position: fixed; margin: 0; pointer-events: none; white-space: nowrap;
        transform: translateX(-50%);
        font: 11px/1 system-ui, sans-serif; color: #fffdf5;
        background: rgb(0 0 0 / 0.6); padding: 1px 4px; border-radius: 3px;
      }
      /* 얼굴 아래 특기 이름표(#311, 설계 6-4-2절): 칸 간격 32px에 셋이 붙지 않게 좌우 padding만 2px. 바탕은 그대로, 버튼 모양은 없다. */
      .hudtag[data-anchor="top-center"] { padding: 1px 2px; }
      /* 게이지 이름표(#312, 설계 6-3-2절): 왼쪽 끝 x 4, 띠 세로 가운데. 글자 크기가 배율마다 달라 세로 가운데는 여기서 맞춘다. */
      .hudtag[data-anchor="middle-left"] { transform: translateY(-50%); }
      /* CSS 배율 1.2 미만(667×375 @2 = 1.0배 등, 설계 6-4-2절 #325): HUD 이름표 전부 글자 사이 좁히기 + padding 0.
         글자는 11px 그대로. 위아래도 0이라 얼굴 이름표 아래끝이 HUD 영역(y 48) 안이다. main.ts가 data-tight를 붙인다. */
      #hudtags[data-tight] .hudtag { padding: 0; font-feature-settings: "palt"; }
      #clear, #faint {
        left: 50%; top: 50%; transform: translate(-50%, -50%);
        font: 700 28px/1.4 system-ui, sans-serif; color: #fffdf5;
        background: rgb(0 0 0 / 0.7); padding: 16px 28px; border-radius: 12px;
      }
      /* 시작 카드(#285, 설계 6-2-1절). 바탕 0번 ink 92%, 테두리 2번, 글자 6번. 글자 크기·최대 폭·높이는 main.ts가 배율로 정한다.
         pointer-events는 켠다: 닫는 탭이 캔버스(게임 입력)에 닿지 않게 카드가 받는다. */
      #card {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box;
        margin: 0; padding: 0.7em 1.1em; overflow: auto; cursor: default; user-select: none;
        font: 13px/1.35 system-ui, sans-serif; color: #fff8ee;
        background: rgb(27 23 32 / 0.92); border: 2px solid #5e5068; border-radius: 6px;
      }
      #card p { margin: 0; }
      #card .goal { font-size: 1.4em; font-weight: 700; color: #f2d65c; }
      #card ul { list-style: none; margin: 0.4em 0; padding: 0; }
      /* 특기 줄·게이지 줄은 자동 줄바꿈 금지(낱말 중간 `高い所 / に届く` 방지, #335). 줄바꿈은 작가가 정한 곳만(6-5절 원칙). */
      #card li { display: flex; align-items: center; gap: 0.6em; white-space: nowrap; }
      /* 특기 줄 사이 틈(#342): 줄 높이 = 얼굴 크기라 틈이 0이면 얼굴 셋이 한 덩어리로 붙는다. 값은 main.ts가 0.15em을 장치 px로 반올림해 넣는다. */
      #card li + li { margin-top: var(--row-gap, 0.15em); }
      #card .gauge { white-space: nowrap; }
      #card canvas { flex: none; width: 48px; height: 48px; image-rendering: pixelated; }
      #card .name { flex: none; min-width: 4.5em; font-weight: 700; }
      #card .start { margin-top: 0.5em; text-align: right; opacity: 0.4; }
      #card[data-ready] .start { opacity: 1; }
      /* 압축 카드(CSS 배율 1.2 미만, #335): 667×375 @2에서 `タップではじめる`가 스크롤 없이 보이게. 얼굴 크기는 main.ts. */
      #card[data-tight] { line-height: 1.25; padding: 0.5em 0.8em; }
      #card[data-tight] ul { margin: 0.3em 0; }
      #card[data-tight] li { gap: 0.4em; }
      #card[data-tight] .start { margin-top: 0.3em; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <p id="hud" aria-live="polite"></p>
    <p id="bubble" aria-live="polite" hidden></p>
    <p id="label" hidden></p>
    <div id="hudtags"></div>
    <p id="clear" role="status" hidden></p>
    <p id="faint" role="status" hidden></p>
    <div id="card" role="dialog" aria-modal="true" aria-labelledby="card-goal" hidden>
      <p id="card-goal" class="goal"></p>
      <p class="why"></p>
      <ul></ul>
      <p class="gauge"></p>
      <p class="start"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
